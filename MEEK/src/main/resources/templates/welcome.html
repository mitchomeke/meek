<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to MEEK</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font for modern Squarespace typography -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-black text-zinc-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased selection:bg-blue-600 selection:text-white relative overflow-hidden">

<!-- Subtle Ambient Radial Glow (Squarespace Style) -->
<div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-900/10 rounded-full blur-3xl pointer-events-none"></div>

<!-- MAIN CARD CONTAINER -->
<div class="relative z-10 w-full max-w-md bg-zinc-950/90 backdrop-blur-2xl p-8 sm:p-10 rounded-3xl border border-zinc-800/80 shadow-2xl shadow-blue-950/30 text-center space-y-8">

    <!-- BRAND HEADER -->
    <div class="space-y-2">
        <span class="text-4xl sm:text-5xl font-black tracking-widest text-white uppercase bg-gradient-to-r from-white via-zinc-200 to-blue-500 bg-clip-text text-transparent block">
            MEEK
        </span>
        <p class="text-xs font-bold uppercase tracking-widest text-zinc-400">The Social App For Music Listeners</p>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="space-y-3.5 pt-2">
        <!-- Button 1: Existing Users -->
        <a th:href="@{/login}"
           class="block w-full py-3.5 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white text-xs font-bold uppercase tracking-widest rounded-full shadow-lg shadow-blue-600/25 hover:shadow-blue-500/40 transition-all duration-200">
            Log In (Existing User)
        </a>

        <!-- Button 2: New Users -->
        <a th:href="@{/register}"
           class="block w-full py-3.5 bg-black/80 hover:bg-zinc-900 text-zinc-200 hover:text-white text-xs font-bold uppercase tracking-widest rounded-full border border-zinc-800 hover:border-zinc-700 transition-all duration-200 shadow-sm">
            Create Account (New User)
        </a>
    </div>

    <!-- FOOTER META -->
    <div class="pt-4 border-t border-zinc-900">
        <p class="text-[11px] text-zinc-500 font-medium">Discover, review, and connect with fellow music enthusiasts.</p>
    </div>

</div>

</body>
</html>
