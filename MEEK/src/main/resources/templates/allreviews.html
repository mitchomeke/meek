<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${music != null ? 'Reviews for ' + music.musicName : 'Music Reviews'}">Music Reviews</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

<div class="max-w-3xl mx-auto space-y-6">

    <!-- Header Section -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-gray-900"
                th:text="${music != null ? music.musicName : 'Music Reviews'}">Song Title</h1>
            <p class="text-sm text-gray-500 mt-1"
               th:text="${music != null && music.artistName != null ? 'Artist: ' + music.artistName : 'All Listener Reviews'}">Artist Name</p>
        </div>
        <a href="javascript:history.back()"
           class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-medium rounded-md transition border border-gray-300">
            &larr; Back
        </a>
    </div>

    <!-- Reviews Section Container -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">

        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <h2 class="text-lg font-semibold text-gray-800">
                Reviews (<span th:text="${#lists.size(allReviews)}">0</span>)
            </h2>
        </div>

        <!-- Empty State: Show if there are no reviews -->
        <div th:if="${#lists.isEmpty(allReviews)}" class="text-center py-12 text-gray-500">
            <svg class="w-12 h-12 mx-auto text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
            <p class="text-base font-medium">No reviews yet.</p>
            <p class="text-xs text-gray-400 mt-1">Be the first to review this song!</p>
        </div>

        <!-- Review List -->
        <div th:if="${!#lists.isEmpty(allReviews)}" class="divide-y divide-gray-100">

            <div th:each="review : ${allReviews}" class="py-5 first:pt-0 last:pb-0">

                <div class="flex items-start justify-between">
                    <!-- Reviewer Details -->
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-emerald-500 text-white font-bold text-sm flex items-center justify-center shadow-sm"
                             th:text="${review.user != null ? #strings.substring(review.user.userName, 0, 1).toUpperCase() : 'U'}">
                            U
                        </div>
                        <div>
                            <h4 class="text-sm font-semibold text-gray-900"
                                th:text="${review.user != null ? review.user.userName : 'Anonymous'}">User Name</h4>
                        </div>
                    </div>

                    <!-- Star Rating Badge -->
                    <div th:if="${review.rating != null}" class="flex items-center gap-1 bg-amber-50 text-amber-700 px-2 py-1 rounded text-xs font-semibold border border-amber-200">
                        <span th:text="${review.rating}">5</span>
                        <svg class="w-3.5 h-3.5 fill-amber-400 text-amber-400" viewBox="0 0 20 20">
                            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                        </svg>
                    </div>
                </div>

                <!-- Review Content -->
                <div class="mt-3 text-sm text-gray-700 leading-relaxed pl-12" th:text="${review.description}">
                    This is where the review comment or feedback text will be displayed for this music item.
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
