<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spotify Track Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8">

<div class="max-w-2xl mx-auto space-y-6">
    <h1 class="text-3xl font-bold text-emerald-400">Search Songs on Spotify</h1>

    <!-- Add the search form here too so users can search again! -->
    <form action="/search" method="get" class="flex gap-2">
        <input type="text" name="query" th:value="${query}" placeholder="Search song or artist..."
               class="flex-1 px-4 py-2 bg-gray-800 border border-gray-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-emerald-400"/>
        <button type="submit" class="px-5 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-md transition">
            Search
        </button>
    </form>

    <!-- Search Results -->
    <div th:if="${tracks != null}" class="space-y-3">
        <div th:each="track : ${tracks}" class="p-3 bg-gray-800 rounded-lg flex items-center gap-4 border border-gray-700">

            <!-- Album Art -->
            <img th:if="${!#lists.isEmpty(track.spotifyAlbum().spotifyImages())}"
                 th:src="${track.spotifyAlbum().spotifyImages()[0].url}"
                 alt="Cover" class="w-12 h-12 rounded shrink-0 object-cover"/>

            <div class="flex-1 min-w-0">
                <h3 class="font-bold text-white truncate" th:text="${track.name}">Song Name</h3>
                <p class="text-sm text-gray-400 truncate" th:text="${track.spotifyArtists()[0].name}">Artist Name</p>
            </div>

            <!-- Action: Write Review for this Spotify Track -->
            <a th:href="@{/allreviews(musicId=${track.id})}"
               class="px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold rounded transition">
                View / Write Reviews
            </a>

        </div>
    </div>

</div>

</body>
</html>
