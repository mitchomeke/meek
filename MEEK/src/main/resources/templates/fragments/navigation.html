<!-- templates/fragments/navigation.html -->
<header th:fragment="navbar(activeTab)"
        class="sticky top-0 z-50 w-full bg-transparent">

    <div class="mx-auto flex h-16 max-w-7xl items-center justify-center px-4">


        <!-- Center: Floating Capsule Navigation -->
        <nav id="floating-tabs"
             class="relative flex items-center p-1 bg-zinc-950/90 rounded-full shadow-2xl backdrop-blur-md">

            <!-- Sliding Spring Pill (Top & bottom set to 4px matching p-1) -->
            <div id="tab-pill"
                 class="absolute top-1 bottom-1 rounded-full bg-zinc-800 opacity-0 pointer-events-none transition-all duration-300 ease-[cubic-bezier(0.34,1.56,0.64,1)]">
            </div>

            <!-- 1. Home -->
            <a th:href="@{/home}"
               th:classappend="${activeTab == 'home'} ? 'text-white is-active' : 'text-zinc-400 hover:text-zinc-200'"
               class="tab-link relative z-10 flex items-center gap-2 px-4 py-1.5 text-xs font-semibold rounded-full select-none transition-colors duration-200">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                <span>Home</span>
            </a>

            <!-- 2. Explore -->
            <a th:href="@{/explore}"
               th:classappend="${activeTab == 'explore'} ? 'text-white is-active' : 'text-zinc-400 hover:text-zinc-200'"
               class="tab-link relative z-10 flex items-center gap-2 px-4 py-1.5 text-xs font-semibold rounded-full select-none transition-colors duration-200">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <span>Explore</span>
            </a>

            <!-- 3. Trending -->
            <a th:href="@{/trending}"
               th:classappend="${activeTab == 'trending'} ? 'text-white is-active' : 'text-zinc-400 hover:text-zinc-200'"
               class="tab-link relative z-10 flex items-center gap-2 px-4 py-1.5 text-xs font-semibold rounded-full select-none transition-colors duration-200">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                </svg>
                <span>Trending</span>
            </a>
        </nav>
    </div>
</header>

<script th:src="@{/js/tabs.js}" defer></script>
