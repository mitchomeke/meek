<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="likeButton" class="inline-block" hx-target="this" hx-swap="outerHTML">

    <!-- 1. UNLIKE FORM (Displayed when already liked) -->
    <form th:if="${#lists.contains(likes, review)}"
          th:hx-post="@{/home/explore/unlike}"
          class="inline-block">
        <input type="hidden" name="reviewId" th:value="${review.getId()}"/>

        <button type="submit"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-rose-950/40 hover:bg-rose-900/60 text-rose-200 text-xs font-medium rounded-full border border-rose-800/50 shadow-sm backdrop-blur-sm transition-all duration-200 hover:scale-105 active:scale-95 group cursor-pointer">
            <svg class="w-4 h-4 text-rose-500 fill-current transition-transform duration-300 ease-out group-hover:scale-125 group-active:scale-90" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span>Liked</span>
        </button>
    </form>

    <!-- 2. LIKE FORM (Displayed when not yet liked) -->
    <form th:unless="${#lists.contains(likes, review)}"
          th:hx-post="@{/home/explore/like}"
          class="inline-block">
        <input type="hidden" name="reviewId" th:value="${review.getId()}"/>

        <button type="submit"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-white text-xs font-medium rounded-full border border-zinc-800 transition-all duration-200 hover:scale-105 active:scale-95 group cursor-pointer">
            <svg class="w-4 h-4 text-zinc-400 group-hover:text-rose-400 fill-none stroke-current stroke-2 transition-transform duration-300 ease-out group-hover:scale-125 group-active:scale-90" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
            <span>Like</span>
        </button>
    </form>

</div>

</body>
</html>
