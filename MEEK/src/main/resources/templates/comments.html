<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${review != null ? 'Comments for ' + review.music.musicName : 'Music Reviews'}">Music Reviews</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font for modern Squarespace typography -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-black text-zinc-100 min-h-screen font-sans antialiased selection:bg-blue-600 selection:text-white relative overflow-x-hidden">

<!-- Subtle Ambient Radial Glow (Squarespace Style) -->
<div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-1/2 -right-32 w-96 h-96 bg-blue-900/10 rounded-full blur-3xl pointer-events-none"></div>

<!-- 1. MODERN NAVIGATION BAR (Squarespace Style Sticky Header) -->
<header class="sticky top-0 z-40 w-full border-b border-zinc-800/80 bg-black/75 backdrop-blur-xl transition-all">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        <!-- Brand Logo -->
        <a th:href="@{/home}" class="flex items-center gap-3 group">
            <span class="text-xl font-black tracking-widest text-white uppercase bg-gradient-to-r from-white via-zinc-200 to-blue-500 bg-clip-text text-transparent">
                MEEK
            </span>
            <span class="hidden sm:inline-block text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-950/60 border border-blue-800/40 text-blue-400">
                Comments
            </span>
        </a>

        <!-- Back Link -->
        <a href="javascript:history.back()"
           class="inline-flex items-center gap-1.5 px-4 py-1.5 bg-zinc-900/80 hover:bg-zinc-800 text-zinc-300 hover:text-white text-xs font-semibold rounded-full transition-all border border-zinc-800 hover:border-zinc-700 shadow-sm">
            <span class="text-sm leading-none">&larr;</span> Back
        </a>
    </div>
</header>

<main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 space-y-8 relative z-10">

    <!-- 2. TRACK HERO BANNER -->
    <div class="relative overflow-hidden rounded-3xl bg-gradient-to-b from-zinc-900/90 to-zinc-950 p-6 sm:p-8 border border-zinc-800/80 shadow-2xl">
        <div class="absolute top-0 right-0 w-64 h-64 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="relative z-10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <span class="text-xs font-bold uppercase tracking-widest text-blue-500 block mb-1">Track Spotlight</span>
                <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white"
                    th:text="${review.music != null ? review.music.musicName : 'Music Reviews'}">Song Title</h1>
                <p class="text-zinc-400 text-sm mt-1.5 font-medium"
                   th:text="${review.music != null && review.music.artistName != null ? 'Artist: ' + review.music.artistName : 'All Listener Reviews'}">Artist Name</p>
            </div>
            <div th:text="${(review != null && review.userName != null) ? 'Reviewed by ' + review.userName : 'UserName' }" class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-blue-950/40 border border-blue-800/30 text-blue-400 text-xs font-semibold shrink-0">
                <span>Reviewed by UserName</span>
            </div>
           <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-blue-950/40 border border-blue-800/30 text-blue-400 text-xs font-semibold shrink-0">
                <span>Community Activity</span>
            </div>
        </div>
    </div>

    <!-- 3. COMMENT SECTION CONTAINER -->
    <div class="bg-zinc-950 p-6 sm:p-8 rounded-3xl border border-zinc-800/80 shadow-2xl space-y-6">

        <!-- HEADER -->
        <div class="space-y-4">
            <!-- HEADER & TOGGLE BUTTON -->
            <div class="flex items-center justify-between border-b border-zinc-900 pb-4">
                <h2 class="text-lg font-bold text-white tracking-tight flex items-center gap-2">
                    <span>Comments</span>
                    <span th:text="${#lists.size(comments)}"
                          class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-blue-950 text-blue-400 border border-blue-800/40">0</span>
                </h2>

                <!-- Trigger Button -->
                <button type="button" onclick="toggleCommentForm()"
                        class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white text-xs font-semibold rounded-lg transition shadow-md shadow-blue-600/20 flex items-center gap-1.5">
                    <span>+ Create Comment</span>
                </button>
            </div>

            <!-- COMMENT FORM (Initially Hidden) -->
            <form id="comment-form" th:method="post" th:action="@{/addComment}" class="hidden space-y-3 bg-zinc-900/50 p-4 rounded-xl border border-zinc-800">
                <input type="hidden" name="reviewId" th:value="${review.id}"/>
                <input type="hidden" name="senderId" th:value="${loggedInUser.id}"/>

                <div>
                    <label class="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-1.5">Description</label>
                    <textarea name="description" rows="3" required placeholder="Write a comment....."
                              class="w-full bg-black border border-zinc-800 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500 placeholder-zinc-600"></textarea>
                </div>

                <div class="flex justify-end gap-2">
                    <button type="button" onclick="toggleCommentForm()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-semibold rounded-lg transition">
                        Cancel
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold uppercase tracking-wider rounded-lg transition shadow-md shadow-blue-600/20">
                        Send Comment
                    </button>
                </div>
            </form>
        </div>

        <!-- EMPTY STATE -->
        <div th:if="${#lists.isEmpty(comments)}" class="text-center py-16 space-y-3">
            <div class="w-12 h-12 rounded-2xl bg-zinc-900 text-zinc-600 flex items-center justify-center mx-auto border border-zinc-800">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
            </div>
            <p class="text-sm font-semibold text-zinc-400">No comments yet.</p>
            <p class="text-xs text-zinc-600 max-w-xs mx-auto">Be the first to share your thoughts on this review!</p>
        </div>

        <!-- COMMENTS LIST -->
        <div th:if="${!#lists.isEmpty(comments)}" class="space-y-4">

            <div th:each="comment : ${comments}"
                 class="p-5 bg-zinc-900/50 hover:bg-zinc-900/80 rounded-2xl border border-zinc-800/80 transition-all duration-200 space-y-3">

                <div class="flex items-center justify-between gap-4">
                    <!-- Comment Author Details -->
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-blue-950 text-blue-400 font-bold text-sm flex items-center justify-center border border-blue-800/40 shadow-lg shadow-blue-950/50 shrink-0"
                             th:text="${comment.sender != null ? #strings.substring(comment.sender.userName, 0, 1).toUpperCase() : 'U'}">
                            U
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-white"
                                th:text="${comment.sender != null ? comment.sender.userName : 'Anonymous'}">User Name</h4>
                            <p class="text-[10px] text-zinc-500 font-medium uppercase tracking-wider">Commenter</p>
                        </div>
                    </div>

                    <!-- Timestamp (Optional) -->
                    <span th:if="${comment.createdAt != null}"
                          th:text="${#temporals.format(comment.createdAt, 'MMM dd, yyyy')}"
                          class="text-xs text-zinc-500 font-medium shrink-0">
                    Jan 01, 2026
                </span>
                </div>

                <!-- Comment Body -->
                <div class="text-sm text-zinc-300 leading-relaxed bg-black/40 p-4 rounded-xl border border-zinc-800/50"
                     th:text="${comment.description != null ? comment.description : 'Comment Description'}">
                    This is where the comment text will be displayed.
                </div>
            </div>

        </div>

    </div>

</main>

<script>
    function toggleCommentForm() {
        const form = document.getElementById('comment-form');
        form.classList.toggle('hidden');
    }
</script>

</body>
</html>
