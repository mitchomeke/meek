<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEEK - Inbox</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-black text-zinc-100 min-h-screen font-sans antialiased selection:bg-blue-600 selection:text-white">

<!-- 1. NAVIGATION BAR -->
<header class="sticky top-0 z-40 w-full border-b border-zinc-800/80 bg-black/75 backdrop-blur-xl transition-all">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <!-- Brand Logo -->
        <a th:href="@{/home}" class="flex items-center gap-3 group">
            <span class="text-xl font-black tracking-widest text-white uppercase bg-gradient-to-r from-white via-zinc-200 to-blue-500 bg-clip-text text-transparent">
                MEEK
            </span>
            <span class="hidden sm:inline-block text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-950/60 border border-blue-800/40 text-blue-400">
                Inbox
            </span>
        </a>

        <!-- Header Actions -->
        <div class="flex items-center gap-3">
            <a th:href="@{/home}"
               class="px-3.5 py-1.5 bg-zinc-900/80 hover:bg-zinc-800 text-zinc-300 hover:text-white text-xs font-medium rounded-full transition-all border border-zinc-800 hover:border-zinc-700">
                &larr; Dashboard
            </a>
            <a th:href="@{/friends}"
               class="px-3.5 py-1.5 bg-zinc-900/80 hover:bg-zinc-800 text-zinc-300 hover:text-white text-xs font-medium rounded-full transition-all border border-zinc-800 hover:border-zinc-700">
                Friends
            </a>
        </div>
    </div>
</header>

<!-- 2. MAIN CONTAINER -->
<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- HERO BANNER -->
    <div class="relative overflow-hidden rounded-2xl bg-gradient-to-b from-zinc-900/90 to-zinc-950 p-6 sm:p-8 border border-zinc-800 shadow-2xl">
        <div class="absolute -top-24 -right-24 w-72 h-72 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="relative z-10 flex items-center justify-between">
            <div>
                <p class="text-xs font-bold uppercase tracking-widest text-blue-500 mb-1">Direct Messages</p>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Your Inbox</h1>
                <p class="text-zinc-400 text-xs sm:text-sm mt-1">Manage ongoing conversations with fellow listeners.</p>
            </div>
            <div class="hidden sm:block">
                <span class="p-3.5 rounded-2xl bg-blue-950/40 border border-blue-800/40 text-blue-400 inline-block">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </span>
            </div>
        </div>
    </div>

    <!-- INBOX CARD CONTAINER -->
    <div class="bg-zinc-950 p-6 sm:p-7 rounded-2xl border border-zinc-800 shadow-xl space-y-4">
        <div class="flex items-center justify-between border-b border-zinc-900 pb-4">
            <h2 class="text-lg font-bold text-white tracking-tight">Active Threads</h2>
            <span class="text-xs text-zinc-500 font-medium" th:text="${#maps.size(inboxConversations)} + ' Conversations'">0 Conversations</span>
        </div>

        <!-- 1. CONVERSATIONS LIST -->
        <div th:if="${inboxConversations != null and !inboxConversations.isEmpty()}" class="space-y-3">
            <div th:each="inbox : ${inboxConversations}"
                 class="group flex items-center justify-between p-4 bg-zinc-900/50 hover:bg-zinc-900/90 rounded-xl border border-zinc-800/80 hover:border-zinc-700/80 transition-all duration-200 gap-4">

                <!-- Left Details (Avatar + Partner Name + Last Message Snippet) -->
                <div class="flex items-center gap-3.5 min-w-0 flex-1">
                    <div class="w-10 h-10 rounded-full bg-blue-950 text-blue-400 font-bold text-sm flex items-center justify-center shrink-0 border border-blue-800/40 shadow-inner">
                        <span th:text="${#strings.substring(inbox.key.userName, 0, 1).toUpperCase()}">F</span>
                    </div>

                    <div class="min-w-0 flex-1 space-y-0.5">
                        <div class="flex items-center gap-2">
                            <h3 class="font-bold text-white text-sm truncate group-hover:text-blue-400 transition-colors"
                                th:text="${inbox.key.userName}">Friend Username</h3>
                        </div>

                        <!-- Last Message Preview -->
                        <p class="text-xs text-zinc-400 truncate leading-relaxed">
                            <span th:if="${inbox.value.sender.userName == loggedInUser.userName}" class="text-zinc-500 font-medium">You: </span>
                            <span th:text="${inbox.value.content}">Last message content goes here...</span>
                        </p>
                    </div>
                </div>

                <!-- Right Action Button -->
                <a th:href="@{/messages(recipient=${inbox.key.userName}, messenger=${loggedInUser.userName})}"
                   class="inline-flex items-center gap-1.5 px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold text-xs rounded-full transition-all shadow-md shadow-blue-600/20 shrink-0">
                    <span>Chat</span>
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </a>
            </div>
        </div>

        <!-- 2. EMPTY STATE -->
        <div th:unless="${inboxConversations != null and !inboxConversations.isEmpty()}"
             class="py-12 text-center space-y-3">
            <div class="w-12 h-12 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-600 flex items-center justify-center mx-auto text-xl">
                💬
            </div>
            <div class="space-y-1">
                <p class="text-xs font-bold uppercase tracking-wider text-zinc-400">No Messages Yet</p>
                <p class="text-xs text-zinc-500">Start a chat with a friend from your network.</p>
            </div>
            <a th:href="@{/friends}"
               class="inline-block mt-2 px-4 py-2 bg-zinc-900 hover:bg-zinc-800 text-zinc-300 text-xs font-semibold rounded-full border border-zinc-800 transition">
                Find Friends
            </a>
        </div>
    </div>

</main>

</body>
</html>
