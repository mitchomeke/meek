<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${review != null ? 'Review for ' + review.getUserName() : 'Music Review'}">Music Reviews</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font for modern Squarespace typography -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-black text-zinc-100 min-h-screen font-sans antialiased selection:bg-blue-600 selection:text-white relative overflow-x-hidden">

<!-- Subtle Ambient Radial Glow (Squarespace Style) -->
<div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-1/2 -right-32 w-96 h-96 bg-blue-900/10 rounded-full blur-3xl pointer-events-none"></div>

<!-- 1. MODERN NAVIGATION BAR (Squarespace Style Sticky Header) -->
<header class="sticky top-0 z-40 w-full border-b border-zinc-800/80 bg-black/75 backdrop-blur-xl transition-all">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        <!-- Brand Logo -->
        <a th:href="@{/home}" class="flex items-center gap-3 group">
            <span class="text-xl font-black tracking-widest text-white uppercase bg-gradient-to-r from-white via-zinc-200 to-blue-500 bg-clip-text text-transparent">
                MEEK
            </span>
            <span class="hidden sm:inline-block text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-950/60 border border-blue-800/40 text-blue-400">
                Review
            </span>
        </a>

        <!-- Back Link -->
        <a th:href="@{/home}"
           class="inline-flex items-center gap-1.5 px-4 py-1.5 bg-zinc-900/80 hover:bg-zinc-800 text-zinc-300 hover:text-white text-xs font-semibold rounded-full transition-all border border-zinc-800 hover:border-zinc-700 shadow-sm">
            <span class="text-sm leading-none">&larr;</span> Back
        </a>
    </div>
</header>

<main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 space-y-8 relative z-10">

    <!-- 2. TRACK HERO BANNER -->
    <div class="relative overflow-hidden rounded-3xl bg-gradient-to-b from-zinc-900/90 to-zinc-950 p-6 sm:p-8 border border-zinc-800/80 shadow-2xl">
        <div class="absolute top-0 right-0 w-64 h-64 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="relative z-10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <span class="text-xs font-bold uppercase tracking-widest text-blue-500 block mb-1">Track Spotlight</span>
                <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white"
                    th:text="${review.getMusic() != null ? review.getMusic().musicName : 'Music Reviews'}">Song Title</h1>
                <p class="text-zinc-400 text-sm mt-1.5 font-medium"
                   th:text="${review.getMusic() != null && review.getMusic().artistName != null ? 'Artist: ' + review.getMusic().artistName : 'All Listener Reviews'}">Artist Name</p>
            </div>
        </div>
    </div>

    <!-- 3. REVIEWS SECTION CONTAINER -->
    <div class="bg-zinc-950 p-6 sm:p-8 rounded-3xl border border-zinc-800/80 shadow-2xl space-y-6">

        <div class="flex items-center justify-between border-b border-zinc-900 pb-4">
            <h2 class="text-lg font-bold text-white tracking-tight flex items-center gap-2">
                <span>Listener Feedback</span>
            </h2>
        </div>
        <!-- Review List -->
        <div th:if="${review != null}" class="space-y-4">

            <div class="p-5 bg-zinc-900/50 hover:bg-zinc-900/80 rounded-2xl border border-zinc-800/80 transition-all duration-200 space-y-3">

                <div class="flex items-center justify-between gap-4">
                    <!-- Reviewer Details -->
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-blue-950 text-blue-400 font-bold text-sm flex items-center justify-center border border-blue-800/40 shadow-lg shadow-blue-950/50 shrink-0"
                             th:text="${review.user != null ? #strings.substring(review.user.userName, 0, 1).toUpperCase() : 'U'}">
                            U
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-white"
                                th:text="${review.user != null ? review.user.userName : 'Anonymous'}">User Name</h4>
                            <p class="text-[10px] text-zinc-500 font-medium uppercase tracking-wider">Verified Listener</p>
                        </div>
                    </div>

                    <!-- Star Rating Badge -->
                    <div th:if="${review.rating != null}" class="flex items-center gap-1.5 bg-amber-950/30 text-amber-400 px-3 py-1 rounded-full text-xs font-bold border border-amber-600/30 shrink-0">
                        <span th:text="${review.rating}">5</span>
                        <svg class="w-3.5 h-3.5 fill-amber-400 text-amber-400" viewBox="0 0 20 20">
                            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                        </svg>
                    </div>
                </div>

                <!-- Review Content -->
                <div class="text-sm text-zinc-300 leading-relaxed bg-black/40 p-4 rounded-xl border border-zinc-800/50 italic" th:text="${review.description}">
                    This is where the review comment or feedback text will be displayed for this music item.
                </div>

            </div>

        </div>

    </div>

</main>

</body>
</html>
