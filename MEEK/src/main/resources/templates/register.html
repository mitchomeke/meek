<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEEK - Create Account</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font for modern Squarespace typography -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-black text-zinc-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased selection:bg-blue-600 selection:text-white relative overflow-hidden">

<!-- Subtle Ambient Radial Glow (Squarespace Style) -->
<div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-900/10 rounded-full blur-3xl pointer-events-none"></div>

<!-- MAIN CARD CONTAINER -->
<div class="relative z-10 w-full max-w-md bg-zinc-950/90 backdrop-blur-2xl p-8 sm:p-10 rounded-3xl border border-zinc-800/80 shadow-2xl shadow-blue-950/30 space-y-6">

    <!-- BRAND HEADER -->
    <div class="text-center space-y-2">
        <a th:href="@{/}" class="inline-block">
            <span class="text-3xl font-black tracking-widest text-white uppercase bg-gradient-to-r from-white via-zinc-200 to-blue-500 bg-clip-text text-transparent">
                MEEK
            </span>
        </a>
        <h2 class="text-xl font-bold tracking-tight text-white">Join the Community</h2>
        <p class="text-zinc-400 text-xs">Create your listener account to start sharing and discovering reviews.</p>
    </div>

    <!-- NOTIFICATION ALERTS -->

    <!-- Error Alert: Username Exists -->
    <div th:if="${param.exists}" class="bg-red-950/40 border border-red-900/50 text-red-300 p-3.5 rounded-xl text-xs font-medium text-center backdrop-blur-sm flex items-center justify-center gap-2">
        <svg class="w-4 h-4 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>This username is already taken. Please try another.</span>
    </div>

    <!-- FORM SECTION -->
    <form th:action="@{/register}" method="post" class="space-y-5">
        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">FirstName</label>
            <input type="text" name="firstname" required placeholder="Your firstName"
                   class="w-full px-4 py-3 bg-black/80 border border-zinc-800 text-white rounded-xl text-sm placeholder-zinc-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all duration-200">
        </div>
        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">LastName</label>
            <input type="text" name="lastname" required placeholder="Your lastName"
                   class="w-full px-4 py-3 bg-black/80 border border-zinc-800 text-white rounded-xl text-sm placeholder-zinc-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all duration-200">
        </div>
        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">Choose Username</label>
            <input type="text" name="username" required placeholder="Choose a username"
                   class="w-full px-4 py-3 bg-black/80 border border-zinc-800 text-white rounded-xl text-sm placeholder-zinc-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all duration-200">
        </div>

        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">Choose Password</label>
            <input type="password" name="password" required placeholder="••••••••"
                   class="w-full px-4 py-3 bg-black/80 border border-zinc-800 text-white rounded-xl text-sm placeholder-zinc-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all duration-200">
        </div>

        <button type="submit"
                class="w-full py-3 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white text-xs font-bold uppercase tracking-widest rounded-full shadow-lg shadow-blue-600/25 hover:shadow-blue-500/40 transition-all duration-200">
            Create Account
        </button>
    </form>

    <!-- FOOTER NAV -->
    <div class="pt-2 text-center border-t border-zinc-900">
        <p class="text-xs text-zinc-500">
            Already have an account?
            <a th:href="@{/login}" class="text-blue-400 hover:text-blue-300 font-semibold hover:underline transition">Log In</a>
        </p>
    </div>

</div>

</body>
</html>
